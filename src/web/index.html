<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elist</title>
  <style>
    :root { --bg:#fff; --fg:#1a1a1a; --line:#e5e5e5; --accent:#2563eb; --muted:#888; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1115; --fg:#e6e6e6; --line:#262b33; --accent:#60a5fa; --muted:#888; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
    header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
    header .title { font-weight:600; }
    #crumbs { flex:1; font-size:14px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #crumbs span { cursor:pointer; color:var(--accent); }
    #crumbs span:hover { text-decoration:underline; }
    #search { padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); min-width:160px; }
    #sort { padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); }
    main { padding:8px 16px 40px; }
    .row { display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:6px; cursor:pointer; }
    .row:hover { background:rgba(127,127,127,.08); }
    .row .ico { width:22px; text-align:center; }
    .row .name { flex:1; }
    .row .size { color:var(--muted); font-size:13px; }
    .empty { color:var(--muted); padding:20px; text-align:center; }
    #modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:10; }
    #modal.show { display:flex; }
    #modal .box { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:16px; max-width:92vw; max-height:92vh; overflow:auto; }
    #modal .box img, #modal .box video, #modal .box iframe { max-width:88vw; max-height:82vh; display:block; border:0; }
    #modal .box .code-preview { max-width:88vw; max-height:82vh; overflow:auto; background:#f5f5f5; padding:16px; border-radius:6px; font-family:'Courier New',monospace; font-size:13px; line-height:1.5; white-space:pre-wrap; word-break:break-all; }
    @media (prefers-color-scheme: dark) {
      #modal .box .code-preview { background:#1e1e1e; color:#d4d4d4; }
    }
    .close { float:right; cursor:pointer; color:var(--muted); }
    input.pw { padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); }
    /* 密码弹窗 */
    .pwmodal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:20; }
    .pwmodal.show { display:flex; }
    .pwbox { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:18px; width:min(92vw,320px); }
    .pwtitle { font-weight:600; margin-bottom:12px; }
    .pwhint { font-size:12px; color:var(--muted); margin-top:8px; min-height:14px; line-height:1.4; }
    .pwbox .pw { width:100%; box-sizing:border-box; }
    .pwrow { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
    .btn { padding:6px 14px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); cursor:pointer; }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    
    /* 左侧导航栏 */
    #sidebar { position:fixed; left:0; top:57px; bottom:0; width:240px; background:var(--bg); border-right:1px solid var(--line); overflow-y:auto; z-index:4; transform:translateX(-100%); transition:transform .3s; }
    #sidebar.open { transform:translateX(0); }
    #sidebar .tree { padding:12px; }
    #sidebar .tree-item { padding:6px 8px; cursor:pointer; border-radius:4px; font-size:14px; }
    #sidebar .tree-item:hover { background:rgba(127,127,127,.08); }
    #sidebar .tree-item.active { background:var(--accent); color:#fff; }
    #sidebar .tree-children { margin-left:16px; }
    
    /* 视图切换 */
    .view-toggle { display:flex; gap:4px; }
    .view-btn { padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); cursor:pointer; }
    .view-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    
    /* 网格视图 */
    .grid-view { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px; padding:12px; }
    .grid-item { display:flex; flex-direction:column; align-items:center; padding:12px; border-radius:8px; cursor:pointer; transition:background .2s; }
    .grid-item:hover { background:rgba(127,127,127,.08); }
    .grid-item .thumb { width:100px; height:100px; display:flex; align-items:center; justify-content:center; background:rgba(127,127,127,.05); border-radius:6px; overflow:hidden; margin-bottom:8px; }
    .grid-item .thumb img { width:100%; height:100%; object-fit:cover; }
    .grid-item .thumb .icon { font-size:48px; }
    .grid-item .name { font-size:13px; text-align:center; word-break:break-word; max-width:100%; }
    
    /* 列表视图 */
    .list-view { padding:8px 16px 40px; }
    
    /* 切换按钮 */
    #sidebar-toggle { position:fixed; left:8px; top:68px; z-index:6; padding:8px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); cursor:pointer; }
    body.sidebar-open #sidebar-toggle { left:248px; }
    body.sidebar-open main { margin-left:240px; }
    
    /* 预览控制按钮 */
    .preview-controls { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
    .preview-controls button { padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); cursor:pointer; font-size:13px; }
    .preview-controls button:hover { background:rgba(127,127,127,.1); }
    
    /* EXIF 信息面板 */
    .exif-panel { margin-top:12px; padding:12px; background:rgba(127,127,127,.05); border-radius:6px; font-size:13px; line-height:1.6; }
    
    /* Markdown 渲染 */
    .markdown-body { padding:16px; line-height:1.6; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top:1em; margin-bottom:0.5em; font-weight:600; }
    .markdown-body h1 { font-size:2em; border-bottom:1px solid var(--line); padding-bottom:0.3em; }
    .markdown-body h2 { font-size:1.5em; border-bottom:1px solid var(--line); padding-bottom:0.3em; }
    .markdown-body h3 { font-size:1.25em; }
    .markdown-body p { margin:0.5em 0; }
    .markdown-body code { background:rgba(127,127,127,.1); padding:2px 6px; border-radius:3px; font-family:'Courier New',monospace; font-size:0.9em; }
    .markdown-body pre { background:rgba(127,127,127,.05); padding:12px; border-radius:6px; overflow-x:auto; }
    .markdown-body pre code { background:none; padding:0; }
    .markdown-body ul, .markdown-body ol { padding-left:2em; }
    .markdown-body blockquote { border-left:4px solid var(--accent); padding-left:1em; margin-left:0; color:var(--muted); }
    .markdown-body table { border-collapse:collapse; width:100%; }
    .markdown-body th, .markdown-body td { border:1px solid var(--line); padding:8px; text-align:left; }
    .markdown-body th { background:rgba(127,127,127,.05); font-weight:600; }
    .markdown-body a { color:var(--accent); text-decoration:none; }
    .markdown-body a:hover { text-decoration:underline; }
    .markdown-body img { max-width:100%; height:auto; }
    
    /* CSV 表格 */
    .csv-table { border-collapse:collapse; width:100%; font-size:13px; }
    .csv-table th, .csv-table td { border:1px solid var(--line); padding:8px; text-align:left; }
    .csv-table th { background:rgba(127,127,127,.05); font-weight:600; position:sticky; top:0; }
    .csv-table tr:hover { background:rgba(127,127,127,.03); }
    
    /* ZIP 文件列表 */
    .zip-file-list { padding:12px; }
    .zip-file-list ul { list-style:none; padding:0; margin:8px 0 0 0; }
    .zip-file-list li { display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid var(--line); }
    .zip-file-list li:last-child { border-bottom:none; }
    .zip-file-list li span:first-child { flex:1; word-break:break-all; }
    
    /* 代码高亮（兼容 hljs） */
    .hljs { background:#f5f5f5; color:#333; }
    @media (prefers-color-scheme: dark) {
      .hljs { background:#1e1e1e; color:#d4d4d4; }
    }
    .hljs-keyword, .hljs-selector-tag, .hljs-deletion { color:#d73a49; }
    .hljs-string, .hljs-addition { color:#032f62; }
    .hljs-comment, .hljs-quote { color:#6a737d; font-style:italic; }
    .hljs-number, .hljs-literal { color:#005cc5; }
    .hljs-title, .hljs-section { color:#6f42c1; }
    .hljs-attr, .hljs-variable { color:#005cc5; }
    @media (prefers-color-scheme: dark) {
      .hljs-keyword, .hljs-selector-tag, .hljs-deletion { color:#f97583; }
      .hljs-string, .hljs-addition { color:#9ecbff; }
      .hljs-comment, .hljs-quote { color:#6a737d; }
      .hljs-number, .hljs-literal { color:#79b8ff; }
      .hljs-title, .hljs-section { color:#b392f0; }
      .hljs-attr, .hljs-variable { color:#79b8ff; }
    }
  </style>
</head>
<body>
  <button id="sidebar-toggle">☰</button>
  <div id="sidebar">
    <div class="tree" id="tree"></div>
  </div>
  
  <header>
    <div class="title">📦 Elist</div>
    <div id="crumbs"></div>
    <div class="view-toggle">
      <button class="view-btn active" data-view="list">列表</button>
      <button class="view-btn" data-view="grid">网格</button>
    </div>
    <select id="sort" title="排序">
      <option value="name_asc">名称 ↑</option>
      <option value="name_desc">名称 ↓</option>
      <option value="time_asc">时间 ↑</option>
      <option value="time_desc">时间 ↓</option>
      <option value="size_asc">大小 ↑</option>
      <option value="size_desc">大小 ↓</option>
      <option value="type_asc">类型 ↑</option>
      <option value="type_desc">类型 ↓</option>
    </select>
    <input id="search" placeholder="搜索当前盘…" />
    <button id="refresh" class="btn" title="强制刷新当前目录（绕过缓存，立即反映密码/文件的改动）">🔄 刷新</button>
    <button id="loginBtn" class="btn">🔐 登录</button>
    <button id="logoutBtn" class="btn" style="display:none">🚪 退出</button>
    <button id="saveConfigBtn" class="btn primary" style="display:none">💾 保存配置</button>
  </header>
  <main id="list"></main>

  <div id="modal"><div class="box"><span class="close" onclick="closeModal()">✕</span><div id="modalBody"></div></div></div>

  <div id="pwModal" class="pwmodal"><div class="pwbox">
    <div class="pwtitle" id="pwTitle">该目录需要密码</div>
    <input id="pwInput" class="pw" type="password" placeholder="请输入密码" autocomplete="off" />
    <div id="pwHint" class="pwhint"></div>
    <div class="pwrow">
      <button id="pwCancel" class="btn">取消</button>
      <button id="pwOk" class="btn primary">确定</button>
    </div>
  </div></div>

  <div id="loginModal" class="pwmodal"><div class="pwbox">
    <div class="pwtitle">管理员登录</div>
    <input id="loginPassword" class="pw" type="password" placeholder="请输入管理员密码" autocomplete="off" />
    <div class="pwrow">
      <button id="loginCancel" class="btn">取消</button>
      <button id="loginOk" class="btn primary">登录</button>
    </div>
  </div></div>

  <div id="editModal" class="pwmodal"><div class="pwbox" style="width:min(92vw,500px)">
    <div class="pwtitle" id="editTitle">编辑配置</div>
    <div style="margin-bottom:12px">
      <label style="display:block;margin-bottom:4px;font-size:13px">路径</label>
      <input id="editPath" class="pw" type="text" placeholder="/path/to/folder" />
    </div>
    <div style="margin-bottom:12px">
      <label style="display:block;margin-bottom:4px;font-size:13px">密码</label>
      <input id="editPassword" class="pw" type="text" placeholder="留空表示无密码" />
    </div>
    <div style="margin-bottom:12px">
      <label style="display:block;margin-bottom:4px;font-size:13px">提示</label>
      <input id="editHint" class="pw" type="text" placeholder="密码提示（可选）" />
    </div>
    <div style="margin-bottom:12px">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px">
        <input id="editHidden" type="checkbox" /> 隐藏此目录
      </label>
    </div>
    <div class="pwrow">
      <button id="editCancel" class="btn">取消</button>
      <button id="editOk" class="btn primary">保存</button>
    </div>
  </div></div>

  <script src="/app.js"></script>
</body>
</html>
