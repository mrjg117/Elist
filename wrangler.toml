name = "elist"
main = "./src/index.ts"
compatibility_date = "2025-04-04"
compatibility_flags = ["nodejs_compat"]
# 部署/自动部署时保留配置外的既有变量与密钥（如 Dashboard 里设的 AUTH_* secret），
# 防止 Git 集成每次 push 自动部署把手工设的密钥清掉。
keep_vars = true

# 静态前端（SPA）由 Workers Assets 托管，边缘就近返回，毫秒级。
# /api/* 与 /dav/* 不命中静态文件，自动交由 Worker 脚本处理。
[assets]
directory = "./src/web"
# 显式绑定 ASSETS：run_worker_first=true 时 Worker 需通过 c.env.ASSETS 取静态资源，
# 不声明 binding 则 ASSETS 不注入 → SPA 兜底路由 c.env.ASSETS.fetch 抛 500（整站起不来）。
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
# Worker 先于静态资源接管所有请求：否则带扩展名的 /api/raw/<文件名> 会被静态资源层
# 误判为静态文件、找不到后按 SPA 兜底返回 index.html（表现为点击复制链接跳主页）。
# 设为 true 后，/api/* 与 /dav/* 始终进 Worker；其余请求由 worker 末行兜底经 ASSETS 提供前端。
run_worker_first = true

# SPA 兜底的降级首页：ASSETS 绑定异常/未注入时由 Worker 返回，保证整站不白屏 500。
# 线上 ASSETS 正常时不会走到此处（始终优先 ASSETS），仅作极端兜底。
[text_blobs]
index_html = "src/web/index.html"

# =====================================================================
# 配置方案（v4，变量拆分）：
#   - AUTH_<NAME>：账号机密（type、凭据等）
#   - MOUNT_<NAME>：挂载配置（users 数组，每个 user 有 user_id 和 mounts）
#   - 变量名后缀匹配：MOUNT_ZHU 自动关联 AUTH_ZHU
#
# AUTH_<NAME> 示例（OneDrive）：
#   {"type":"onedrive","tenant_id":"<tid>","client_id":"<cid>","cert_pem":"...","cert_key":"..."}
#
# MOUNT_<NAME> 示例：
#   {"users":[{"user_id":"user@org.com","mounts":[{"path":"/od","root":"/","title":"我的网盘","e5rnl":true}]}]}
#
# 密码/隐藏配置：统一存放在存储根目录的 .elist.xlsx 文件中
#   - passwords sheet：路径密码配置
#   - hidden sheet：隐藏目录列表
#   - config sheet：全局配置（如 admin_password）
#
# 环境变量：
#   - CONF_PW：xlsx 配置文件加密密码（可选）
#   - CONFIG_AUTH：指定配置文件存储账号（可选，如 AUTH_ZHU 则写 ZHU）
#   - CONFIG_PATH：配置文件存储路径（可选，默认 /）
# =====================================================================

# 公用变量（非敏感，可明文；也可 secret）
[vars]
SITE_TITLE = "Elist"
# 资产缓存：no-cache 强制浏览器每次校验，部署后刷新即见最新版（避免"看不到改动"）
CACHE_CONTROL = "public, max-age=0, must-revalidate"
# MOUNT_ORDER = "/od,/s3"          # 根目录盘顺序（逗号分隔）
# S3_LINK_TTL = "86400"            # S3 下载直链有效期（秒），默认 3600；弱网续传可加大

# E5 续期配置
E5RNL_RUN_PROBABILITY = "0.5"    # 每次 cron 触发执行续期的概率（0-1），制造时间波动
E5RNL_MAX_API_CALLS = "48"       # 每轮最多 API 调用次数
E5RNL_MAX_RUNTIME_MS = "25000"   # 每轮最大运行时间（毫秒）
E5RNL_CONCURRENCY = "6"          # 并发批次大小
E5RNL_ACTION_DELAY_MIN_MS = "0"  # 动作间最小延迟（毫秒）
E5RNL_ACTION_DELAY_MAX_MS = "300" # 动作间最大延迟（毫秒）

# Cron 触发器：每 10 分钟触发一次 E5 续期
[triggers]
crons = ["*/10 * * * *"]

# 注意：本方案刻意不使用 [[d1_databases]] / [[kv_namespaces]]，
# 所有状态 = env vars(secret) + 存储内 .elist.xlsx 配置文件，零 KV/D1/SQL。
