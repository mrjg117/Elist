name = "elist"
main = "./src/index.ts"
compatibility_date = "2025-04-04"
compatibility_flags = ["nodejs_compat"]
keep_vars = true  # deploy 保留 Dashboard 手工设的变量/密钥，不被仓库配置覆盖

# 静态前端托管
[assets]
directory = "./src/web"                          # 前端文件目录（必需）
binding = "ASSETS"                               # Worker 用 c.env.ASSETS 取静态资源（必需）
not_found_handling = "single-page-application"   # 未知路径回退 index.html，SPA 路由（必需）
run_worker_first = true                          # Worker 优先，避免 /api/raw/x.jpg 被当静态文件拦掉

# 变量：真实值在 Dashboard 配；下面示例默认注释，想启用删行首 #，值后是说明
# 后缀匹配：AUTH_ZHU ↔ MOUNT_ZHU
[vars]
# SITE_TITLE = "Elist"                          # 站点标题，默认 Elist
# CACHE_CONTROL = "public, max-age=0, must-revalidate"  # 下载缓存头，默认每次校验
# MOUNT_ORDER = "/od,/s3"                        # 根目录盘显示顺序，逗号分隔
# S3_LINK_TTL = "86400"                          # S3 下载直链有效期秒数，默认 3600
# CONFIG_AUTH = "ZHU"                            # 配置文件 .elist.xlsx 存哪个账号（AUTH 后缀名）
# CONFIG_PATH = "/config"                        # 配置文件存储路径，默认根 /
# CONF_PW = "你的密码"                            # .elist.xlsx 加密密码（可选）
# AUTH_ZHU = '{"type":"onedrive","tenant_id":"<租户ID>","client_id":"<应用ID>","cert_thumbprint":"<x5t的base64url>","cert_key":"<私钥PEM>"}'  # OneDrive 租户凭据，Secret；cert_key 内换行写 \n
# MOUNT_ZHU = '[{"user_id":"sharepoint","mounts":[{"path":"/pan","root":"/","title":"网盘"}]}]'  # 挂载配置，明文；数组可挂多用户，user_id=sharepoint 挂 SP 根站点

# 密码/隐藏配置存存储根目录 .elist.xlsx；不用 KV/D1/SQL
